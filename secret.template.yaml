# secret.template.yaml
#
# YE FILE COMMIT KARNI HAI, secret.yaml NAHI.
#
# Isse dusra developer (ya recruiter README padhते waqt) samajh jata hai
# ke app ko kaunsi secret chahiye, bina asal value dekhe.
#
# Asal secret Jenkins pipeline khud banata hai (dekho Jenkinsfile ki
# "Update K8s Secret" stage) ya manually is tarah banao:
#
#   kubectl create secret generic myapp-secret \
#     --from-literal=SESSION_SECRET=$(openssl rand -hex 32)
#
apiVersion: v1
kind: Secret
metadata:
  name: myapp-secret
  labels:
    app: myapp
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_ME_DO_NOT_COMMIT_REAL_VALUE"
